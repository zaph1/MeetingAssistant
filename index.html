<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Upload MP4</title> <style> body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 24px; color: #1f2937; } .card { max-width: 760px; margin: 0 auto; background: white; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); } input, button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 10px; border: 1px solid #d1d5db; font-size: 14px; box-sizing: border-box; } button { background: #2563eb; color: white; border: none; cursor: pointer; font-weight: 700; } .box { margin-top: 16px; padding: 14px; border-radius: 10px; white-space: pre-wrap; background: #f9fafb; border: 1px solid #e5e7eb; min-height: 100px; } label { display: block; margin-top: 16px; font-weight: 600; } </style> </head> <body> <div class="card"> <h1>Upload MP4</h1> <label for="toEmail">To email</label> <input id="toEmail" type="email" placeholder="example@gmail.com" /> <label for="fileInput">Choose MP4 file</label> <input id="fileInput" type="file" accept="video/mp4" /> <button id="uploadBtn">Upload and Run</button> <div class="box" id="status">Idle</div> <div class="box" id="result">Result will appear here.</div> </div> <script> const btn = document.getElementById("uploadBtn"); const statusEl = document.getElementById("status"); const resultEl = document.getElementById("result"); btn.addEventListener("click", async () => { const file = document.getElementById("fileInput").files[0]; const toEmail = document.getElementById("toEmail").value.trim(); if (!toEmail) { statusEl.textContent = "Please enter a recipient email."; return; } if (!file) { statusEl.textContent = "Please choose an MP4 file."; return; } const formData = new FormData(); formData.append("file", file); formData.append("to_email", toEmail); btn.disabled = true; statusEl.textContent = "Uploading..."; resultEl.textContent = "Waiting..."; try { const response = await fetch("/upload-and-run", { method: "POST", body: formData }); const data = await response.json(); if (!response.ok) { throw new Error(data.detail || "Request failed"); } statusEl.textContent = Done. file_path: ${data.file_path}; resultEl.textContent = data.result_text; } catch (error) { statusEl.textContent = "Error"; resultEl.textContent = error.message; console.error(error); } finally { btn.disabled = false; } }); </script> </body> </html>
